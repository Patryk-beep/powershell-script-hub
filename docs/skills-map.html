<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code — Installed Skills Map</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#11151f; --ink:#e6e9ef; --muted:#8b93a7;
    --line:#1e2533; --chip:#1a2030; --chiph:#232c40;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{padding:28px 32px 18px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:linear-gradient(180deg,#0b0e14,#0b0e14ee);backdrop-filter:blur(6px);z-index:5}
  h1{margin:0;font-size:22px;letter-spacing:.3px}
  .sub{color:var(--muted);margin-top:6px;font-size:13px}
  .controls{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  #search{flex:1;min-width:220px;max-width:420px;background:var(--panel);border:1px solid var(--line);
    color:var(--ink);padding:9px 12px;border-radius:9px;outline:none}
  #search:focus{border-color:#3a4a6b}
  .count{color:var(--muted);font-size:12px}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .legend button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:5px 11px;border-radius:999px;font-size:12px;display:flex;align-items:center;gap:7px;transition:.15s}
  .legend button:hover{border-color:#3a4a6b}
  .legend button.off{opacity:.35}
  .dot{width:9px;height:9px;border-radius:50%}
  main{padding:24px 32px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;align-items:start}
  .fam{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    border-top:3px solid var(--accent)}
  .fam h2{margin:0;padding:14px 16px 10px;font-size:15px;display:flex;align-items:center;gap:9px}
  .fam h2 .n{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}
  .fam .desc{color:var(--muted);padding:0 16px 12px;font-size:12.5px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 16px}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;
    cursor:pointer;transition:.12s}
  .chip:hover,.chip.sel{background:var(--chiph);border-color:var(--accent)}
  .chip b{font-weight:600}
  /* shared detail panel (replaces clipped per-chip tooltips) */
  #detail{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0f1422;
    border-top:2px solid var(--accent,#3a4a6b);padding:14px 32px;
    box-shadow:0 -10px 30px #0009;transform:translateY(110%);transition:transform .18s;display:flex;gap:14px;align-items:flex-start}
  #detail.show{transform:translateY(0)}
  #detail .dname{font-weight:700;white-space:nowrap}
  #detail .dfam{color:var(--muted);font-size:12px;white-space:nowrap}
  #detail .ddesc{flex:1;font-size:13px;line-height:1.5}
  #detail .dclose{cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}
  #detail .dclose:hover{color:var(--ink)}
  .hidden{display:none!important}
  footer{color:var(--muted);font-size:12px;padding:0 32px 40px;text-align:center}
  a{color:#7aa2f7}
</style>
</head>
<body>
<header>
  <h1>🧭 Claude Code — Installed Skills Map</h1>
  <div class="sub">Every skill currently available to this session, grouped by family. Hover a chip for what it does. Generated <span id="date"></span>.</div>
  <div class="controls">
    <input id="search" placeholder="Filter skills…  (e.g. 'test', 'deploy', 'memory')" autocomplete="off">
    <span class="count" id="count"></span>
  </div>
  <div class="legend" id="legend"></div>
</header>
<main id="grid"></main>
<div id="detail">
  <span class="dname"></span><span class="dfam"></span>
  <span class="ddesc"></span><span class="dclose" onclick="hideDetail()">✕</span>
</div>
<footer>
  Tip: families are toggleable in the legend above. This is a static snapshot — the live list lives in your session's skill registry.
</footer>

const grid = document.getElementById('grid');
const legend = document.getElementById('legend');
const search = document.getElementById('search');
const count = document.getElementById('count');
document.getElementById('date').textContent = new Date().toISOString().slice(0,10);

let total = 0;
FAMILIES.forEach(f=>{
  total += f.skills.length;
  // family card
  const card = document.createElement('section');
  card.className='fam'; card.dataset.fam=f.id;
  card.style.setProperty('--accent', f.color);
  card.innerHTML = `<h2><span class="dot" style="background:${f.color}"></span>${f.name}
      <span class="n">${f.skills.length}</span></h2><div class="desc">${f.desc}</div>`;
  const chips = document.createElement('div'); chips.className='chips';
  f.skills.forEach(([name,desc])=>{
    const c=document.createElement('div'); c.className='chip';
    c.dataset.text=(name+' '+desc).toLowerCase();
    c.title=name+' — '+desc;            // native tooltip (never clipped)
    c.innerHTML=`<b>${name}</b>`;
    const show=()=>showDetail(name,f.name,f.color,desc,c);
    c.addEventListener('mouseenter',show);
    c.addEventListener('click',show);
    chips.appendChild(c);
  });
  card.appendChild(chips);
  grid.appendChild(card);
  // legend toggle
  const b=document.createElement('button'); b.dataset.fam=f.id;
  b.innerHTML=`<span class="dot" style="background:${f.color}"></span>${f.name} <span style="color:var(--muted)">${f.skills.length}</span>`;
  b.onclick=()=>{b.classList.toggle('off');card.classList.toggle('hidden',b.classList.contains('off'));updateCount();};
  legend.appendChild(b);
});

const detail=document.getElementById('detail');
let selChip=null;
function showDetail(name,fam,color,desc,chip){
  detail.style.setProperty('--accent',color);
  detail.querySelector('.dname').textContent=name;
  detail.querySelector('.dname').style.color=color;
  detail.querySelector('.dfam').textContent='· '+fam;
  detail.querySelector('.ddesc').textContent=desc;
  detail.classList.add('show');
  if(selChip)selChip.classList.remove('sel');
  selChip=chip; chip.classList.add('sel');
}
function hideDetail(){detail.classList.remove('show');if(selChip)selChip.classList.remove('sel');selChip=null;}

function updateCount(){
  const vis=[...document.querySelectorAll('.chip')].filter(c=>!c.classList.contains('hidden')
    && !c.closest('.fam').classList.contains('hidden')).length;
  count.textContent=`${vis} / ${total} skills shown`;
}
search.addEventListener('input',()=>{
  const q=search.value.trim().toLowerCase();
  document.querySelectorAll('.fam').forEach(fam=>{
    let any=false;
    fam.querySelectorAll('.chip').forEach(c=>{
      const hit=!q||c.dataset.text.includes(q);
      c.classList.toggle('hidden',!hit); if(hit)any=true;
    });
    if(q) fam.classList.toggle('hidden',!any);
    else fam.classList.toggle('hidden',
      legend.querySelector(`button[data-fam="${fam.dataset.fam}"]`).classList.contains('off'));
  });
  updateCount();
});
updateCount();
</script>

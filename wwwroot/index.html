<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Hub</title>
  <link rel="preload" as="font" type="font/woff2" href="vendor/fonts/geist-sans-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="vendor/fonts/geist-mono-latin.woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="vendor/alpine.min.js" defer></script>
</head>
<body x-data="hubApp()" x-init="init()" x-cloak>

  <!-- Animated multi-blob gradient underlay (P-ui-5b) — covers entire viewport at all scroll positions -->
  <div class="gradient-bg" aria-hidden="true">
    <span class="blob blob-violet"></span>
    <span class="blob blob-cyan"></span>
    <span class="blob blob-magenta"></span>
    <span class="blob blob-amber"></span>
  </div>


  <!-- Inline SVG icon sprite (Lucide-derived paths, MIT) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-terminal" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-rotate" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9"  x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m20 20-7-7"/><path d="m5 14 9-9 5 5-9 9-5-5z"/><path d="M9 18H4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
      <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></symbol>
      <symbol id="i-hash" viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
      <symbol id="i-toggle" viewBox="0 0 24 24"><rect x="1" y="5" width="22" height="14" rx="7" ry="7"/><circle cx="16" cy="12" r="3" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-list-multi" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="14" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
      <symbol id="i-select" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
      <symbol id="i-puzzle" viewBox="0 0 24 24"><path d="M19.4 7H17V4.6a2.6 2.6 0 0 0-5.2 0V7H8.6a2.6 2.6 0 0 0 0 5.2H11V14a3 3 0 1 1-6 0v-1H3v1a5 5 0 0 0 8.8 3.3 5 5 0 0 0 8.6-3.3v-1.4a2.6 2.6 0 0 0 0-5.2z"/></symbol>
    </defs>
  </svg>

  <header class="hub-header" role="banner">
    <span class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      </span>
      <span class="brand-name">Hub</span>
    </span>

    <span class="hub-meta">
      <span class="hub-version" x-show="version" x-text="'v' + version"></span>
      <span class="hub-port" x-show="port" x-text="':' + port"></span>
    </span>

    <span class="hub-spacer"></span>

    <div class="tab-nav" role="tablist">
      <button type="button" class="tab-btn" :class="{ active: activeTab === 'catalog' }" @click="switchTab('catalog')" role="tab" :aria-selected="activeTab === 'catalog'">Catalog</button>
      <button type="button" class="tab-btn" :class="{ active: activeTab === 'workflows' }" @click="switchTab('workflows')" role="tab" :aria-selected="activeTab === 'workflows'">Workflows</button>
      <button type="button" class="tab-btn" :class="{ active: activeTab === 'history' }" @click="switchTab('history')" role="tab" :aria-selected="activeTab === 'history'">History</button>
    </div>

    <button class="back-btn" x-show="activeTab === 'catalog' && !selected" @click="openSetup()" type="button" aria-label="Open settings">
      <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
      <span>Settings</span>
    </button>

    <button class="back-btn" x-show="activeTab === 'catalog' && selected" @click="deselect()" type="button" aria-label="Back to catalog">
      <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>
      <span>Back</span>
    </button>
  </header>

  <!-- Toolbar (catalog tab only) -->
  <section class="toolbar" x-show="activeTab === 'catalog' && !selected" role="search">
    <label class="search-box">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input
        type="search"
        class="search-input"
        x-model="query"
        x-ref="searchInput"
        placeholder="Search scripts and tools…"
        aria-label="Search"
        autocomplete="off"
        spellcheck="false">
      <button type="button" class="search-clear" x-show="query" @click="query = ''" aria-label="Clear search">
        <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
      <span class="search-hint" x-show="!query" aria-hidden="true"><kbd class="kbd">/</kbd></span>
    </label>

    <div class="chip-group" role="group" aria-label="Filter by kind">
      <button type="button" class="chip" :aria-pressed="kindFilter === 'all'" @click="kindFilter = 'all'">
        <svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>
        <span>All</span>
        <span x-text="counts.all"></span>
      </button>
      <button type="button" class="chip" :aria-pressed="kindFilter === 'ps1'" @click="kindFilter = 'ps1'">
        <svg class="icon" aria-hidden="true"><use href="#i-terminal"/></svg>
        <span>.ps1</span>
        <span x-text="counts.ps1"></span>
      </button>
      <button type="button" class="chip" :aria-pressed="kindFilter === 'exe'" @click="kindFilter = 'exe'">
        <svg class="icon" aria-hidden="true"><use href="#i-box"/></svg>
        <span>.exe</span>
        <span x-text="counts.exe"></span>
      </button>
      <button type="button" class="chip" :aria-pressed="kindFilter === 'cloud'" @click="kindFilter = 'cloud'" x-show="counts.cloud > 0">
        <svg class="icon" aria-hidden="true"><use href="#i-cloud"/></svg>
        <span>Cloud</span>
        <span x-text="counts.cloud"></span>
      </button>
    </div>

    <button
      type="button"
      class="chip chip-standalone"
      :aria-pressed="showHidden"
      @click="showHidden = !showHidden"
      x-show="counts.hidden > 0"
      :title="showHidden ? 'Hide hidden items' : 'Show hidden items'">
      <svg class="icon" aria-hidden="true"><use :href="showHidden ? '#i-eye' : '#i-eye-off'"/></svg>
      <span x-text="showHidden ? 'Showing hidden' : 'Show hidden'"></span>
      <span class="chip-count" x-text="counts.hidden"></span>
    </button>

    <select class="sort-select" x-model="sortBy" aria-label="Sort items">
      <option value="name-asc">Name (A–Z)</option>
      <option value="name-desc">Name (Z–A)</option>
      <option value="mtime-desc">Recent first</option>
      <option value="mtime-asc">Oldest first</option>
      <option value="kind">Kind</option>
    </select>

    <span class="toolbar-count" x-show="loaded" x-text="filteredItems.length + ' / ' + items.length"></span>
  </section>

  <template x-if="error">
    <div class="banner banner-error" role="alert">
      <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
      <span x-text="error"></span>
    </div>
  </template>

  <template x-if="warnings && warnings.length">
    <div class="banner banner-warn" role="status">
      <svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>
      <div>
        <strong>Warnings</strong>
        <ul>
          <template x-for="w in warnings" :key="w"><li x-text="w"></li></template>
        </ul>
      </div>
    </div>
  </template>

  <main>

    <!-- ── Catalog tab ─────────────────────────────────────────────── -->
    <template x-if="activeTab === 'catalog'">
      <div>

    <!-- Loading -->
    <template x-if="!loaded">
      <div id="status" role="status">
        <svg class="icon-xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.6"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span>Loading catalog…</span>
      </div>
    </template>

    <!-- Empty (no items at all) -->
    <template x-if="loaded && items.length === 0 && !selected">
      <div class="empty">
        <svg class="icon-xl"><use href="#i-inbox"/></svg>
        <p class="empty-title">No scripts or tools found</p>
        <p class="empty-detail">Drop a <code>.ps1</code> or <code>.exe</code> into a configured scan root to see it here.</p>
      </div>
    </template>

    <!-- Empty (filtered) -->
    <template x-if="loaded && items.length > 0 && filteredItems.length === 0 && !selected">
      <div class="empty">
        <svg class="icon-xl"><use href="#i-filter"/></svg>
        <p class="empty-title">No matches</p>
        <p class="empty-detail">Try a different search term or clear the kind filter.</p>
        <button type="button" class="btn-ghost" @click="resetFilters()">
          <svg class="icon" aria-hidden="true"><use href="#i-eraser"/></svg>
          <span>Reset filters</span>
        </button>
      </div>
    </template>

    <!-- Items grid -->
    <section class="items-grid" x-show="!selected && filteredItems.length" aria-label="Available scripts and tools">
      <template x-for="(item, idx) in filteredItems" :key="item.id">
        <div
          class="item-card"
          role="button"
          tabindex="0"
          :class="{ 'cloud-only': item.cloudOnly, 'is-hidden': isHidden(item) }"
          @click="selectItem(item)"
          @keydown.enter.prevent="selectItem(item)"
          @keydown.space.prevent="selectItem(item)"
          :style="'animation-delay:' + Math.min(idx * 18, 240) + 'ms'"
          :aria-label="'Open ' + item.name + (item.cloudOnly ? ' (cloud-only)' : '') + (isHidden(item) ? ' (hidden)' : '')">

          <button
            type="button"
            class="card-hide-btn"
            @click.stop="toggleHidden(item)"
            @keydown.enter.stop="toggleHidden(item)"
            @keydown.space.stop="toggleHidden(item)"
            :title="isHidden(item) ? 'Unhide' : 'Hide from catalog'"
            :aria-label="isHidden(item) ? 'Unhide ' + item.name : 'Hide ' + item.name">
            <svg class="icon" aria-hidden="true"><use :href="isHidden(item) ? '#i-eye' : '#i-eye-off'"/></svg>
          </button>

          <div class="item-card-row">
            <span class="kind-icon" :class="'kind-' + item.kind" aria-hidden="true">
              <svg class="icon-lg"><use :href="item.kind === 'exe' ? '#i-box' : '#i-terminal'"/></svg>
            </span>
            <div class="item-card-meta">
              <span class="kind-badge" :class="'kind-' + item.kind" x-text="item.kind"></span>
              <span class="cloud-badge" x-show="item.cloudOnly" title="Cloud-only (OneDrive) — not materialized">
                <svg class="icon" aria-hidden="true"><use href="#i-cloud"/></svg>
                <span>cloud</span>
              </span>
            </div>
          </div>

          <h2 class="item-name" x-text="item.name"></h2>

          <p class="item-description" x-show="item.description" x-text="item.description" :title="item.description"></p>
          <p class="item-description item-description-missing" x-show="!item.description">No description available.</p>

          <div class="item-card-params" x-show="item.paramPreview || isRawCard(item)">
            <template x-if="isRawCard(item)">
              <span class="param-chip param-chip-raw" title="No typed schema — raw arguments only">
                <svg class="icon param-chip-icon" aria-hidden="true"><use href="#i-info"/></svg>
                <span>raw</span>
              </span>
            </template>
            <template x-if="item.paramPreview">
              <span class="param-chip" :title="item.paramPreview.count + ' parameter' + (item.paramPreview.count === 1 ? '' : 's')">
                <span x-text="item.paramPreview.count + ' param' + (item.paramPreview.count === 1 ? '' : 's')"></span>
              </span>
            </template>
            <template x-if="item.paramPreview && item.paramPreview.requiredCount > 0">
              <span class="param-chip param-chip-required" :title="item.paramPreview.requiredCount + ' required'">
                <span x-text="item.paramPreview.requiredCount + ' required'"></span>
              </span>
            </template>
            <template x-for="tag in paramChipTags(item)" :key="tag.kind">
              <span class="param-chip" :title="tag.title">
                <svg class="icon param-chip-icon" aria-hidden="true"><use :href="tag.iconRef"/></svg>
              </span>
            </template>
          </div>

          <div class="item-foot">
            <span class="item-foot-row item-root" :title="item.root">
              <svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>
              <span x-text="shortRoot(item.root)"></span>
            </span>
            <span class="hub-spacer"></span>
            <span class="item-foot-row" :title="item.mtime">
              <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>
              <span x-text="formatMtime(item.mtime)"></span>
            </span>
          </div>
        </div>
      </template>
    </section>

    <!-- Form pane (catalog) -->
    <template x-if="selected">
      <section class="form-pane" aria-label="Run configuration">
        <header class="form-pane-header">
          <span class="kind-icon" :class="'kind-' + selected.kind" aria-hidden="true">
            <svg><use :href="selected.kind === 'exe' ? '#i-box' : '#i-terminal'"/></svg>
          </span>
          <div class="form-pane-titles">
            <h2 class="form-pane-title" x-text="selected.name"></h2>
            <p class="form-pane-description" x-show="selected.description" x-text="selected.description"></p>
            <p class="form-pane-path" x-text="schema?.scriptPath || selected.path"></p>
          </div>
        </header>

        <template x-if="schemaLoading">
          <p class="empty">Loading schema…</p>
        </template>

        <!-- Typed mode form -->
        <template x-if="schema && schema.mode === 'typed'">
          <form class="run-form" @submit.prevent="submit()">
            <template x-if="schema.fields && schema.fields.length === 0">
              <p class="form-help span-full">No parameters &mdash; press Run to execute.</p>
            </template>

            <template x-for="field in schema.fields" :key="field.name">
              <div class="form-field" :data-widget="field.widget">

                <!-- Boolean fields render as inline checkbox + label -->
                <template x-if="field.widget === 'checkbox' || field.widget === 'checkbox-switch'">
                  <label class="form-checkbox-wrap">
                    <input type="checkbox" class="form-checkbox" x-model="formValues[field.name]">
                    <span class="form-name" x-text="field.name"></span>
                    <span class="form-type" x-text="field.type"></span>
                  </label>
                </template>

                <!-- All other widgets render with label above input -->
                <template x-if="field.widget !== 'checkbox' && field.widget !== 'checkbox-switch'">
                  <label class="form-label">
                    <span class="form-name" x-text="field.name"></span>
                    <span class="form-aliases" x-show="field.aliases && field.aliases.length" x-text="'aka: ' + (field.aliases || []).join(', ')"></span>
                    <span class="form-type" x-text="field.type"></span>
                    <span class="form-required" x-show="field.required" title="Required">*</span>
                  </label>
                </template>

                <template x-if="field.widget === 'textbox'">
                  <input type="text" class="form-input"
                         x-model="formValues[field.name]"
                         :placeholder="field.default ?? 'value'"
                         :required="field.required"
                         :pattern="field.pattern || null"
                         :minlength="field.minlength || null"
                         :maxlength="field.maxlength || null"
                         autocomplete="off" spellcheck="false">
                </template>

                <template x-if="field.widget === 'number'">
                  <input type="number" class="form-input"
                         x-model.number="formValues[field.name]"
                         :required="field.required"
                         :min="(field.min !== null && field.min !== undefined) ? field.min : null"
                         :max="(field.max !== null && field.max !== undefined) ? field.max : null"
                         :step="field.step || null">
                </template>

                <template x-if="field.widget === 'password'">
                  <input type="password" class="form-input"
                         x-model="formValues[field.name]"
                         :required="field.required"
                         :minlength="field.minlength || null"
                         :maxlength="field.maxlength || null"
                         autocomplete="new-password" spellcheck="false">
                </template>

                <template x-if="field.widget === 'datetime-local'">
                  <input type="datetime-local" class="form-input"
                         x-model="formValues[field.name]"
                         :required="field.required">
                </template>

                <template x-if="field.widget === 'url'">
                  <input type="url" class="form-input"
                         x-model="formValues[field.name]"
                         :required="field.required"
                         :pattern="field.pattern || null"
                         autocomplete="off">
                </template>

                <template x-if="field.widget === 'unsupported'">
                  <div class="form-unsupported">
                    <svg class="icon" aria-hidden="true"><use href="#i-puzzle"/></svg>
                    <span>Not editable in typed mode (e.g. ScriptBlock). Run via raw mode if required.</span>
                  </div>
                </template>

                <template x-if="field.widget === 'dropdown'">
                  <select class="form-input" x-model="formValues[field.name]" :required="field.required">
                    <option value="" disabled>— select —</option>
                    <template x-for="opt in (field.options || [])" :key="opt">
                      <option :value="opt" x-text="opt"></option>
                    </template>
                  </select>
                </template>

                <template x-if="field.widget === 'textarea-multi'">
                  <textarea class="form-input form-textarea" x-model="formValues[field.name]" placeholder="One value per line" spellcheck="false"></textarea>
                </template>

                <template x-if="field.widget === 'textarea-multi' && (field.countMin !== null || field.countMax !== null)">
                  <small class="form-help" x-text="textareaCountHint(field, formValues[field.name])"></small>
                </template>

                <template x-if="field.widget === 'file'">
                  <input type="file" class="form-input" @change="formValues[field.name] = $event.target.files[0]?.name || ''">
                </template>

                <p class="form-help" x-show="field.help" x-text="field.help"></p>
              </div>
            </template>
          </form>
        </template>

        <!-- Raw mode form -->
        <template x-if="schema && schema.mode === 'raw'">
          <form class="run-form raw" @submit.prevent="submit()">
            <p class="raw-mode-note">
              <svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>
              <span>
                <strong>Raw mode</strong> &mdash;
                <span x-text="schema.reason || (schema.kind === 'exe' ? 'compiled executable (no AST introspection)' : 'no typed schema available')"></span>.
                Type arguments exactly as on the command line.
              </span>
            </p>
            <div class="form-field span-full">
              <label class="form-label"><span class="form-name">Arguments</span></label>
              <textarea class="form-input form-textarea" x-model="formValues.__rawArgs" placeholder="-Foo bar -Switch" spellcheck="false" autofocus></textarea>
            </div>
          </form>
        </template>

        <!-- Actions -->
        <div class="form-actions">
          <button type="button" class="btn-primary" @click="submit()" :disabled="!isFormValid() || submitting">
            <template x-if="!submitting">
              <svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>
            </template>
            <template x-if="submitting && !ended">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation:pulse 1.2s ease-in-out infinite"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            </template>
            <template x-if="ended">
              <svg class="icon" aria-hidden="true"><use href="#i-rotate"/></svg>
            </template>
            <span x-show="!submitting">Run</span>
            <span x-show="submitting && !ended">Running…</span>
            <span x-show="ended">Run again</span>
          </button>

          <button type="button" class="btn-danger" @click="kill()" x-show="submitting && !ended">
            <svg class="icon" aria-hidden="true"><use href="#i-stop"/></svg>
            <span>Kill</span>
          </button>

          <button type="button" class="btn-ghost" @click="clearLog()" x-show="logLines.length && !submitting">
            <svg class="icon" aria-hidden="true"><use href="#i-eraser"/></svg>
            <span>Clear log</span>
          </button>

          <span class="form-disabled-hint" x-show="!isFormValid() && !submitting">
            <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
            <span>Fill required fields first</span>
          </span>

          <span class="exit-info" x-show="ended">
            <span class="exit-code" :class="exitCode === 0 ? 'exit-ok' : 'exit-fail'">
              <svg class="icon" aria-hidden="true"><use :href="exitCode === 0 ? '#i-check' : '#i-x'"/></svg>
              <span x-text="'exit ' + exitCode"></span>
            </span>
            <span class="status-tag" x-text="endStatus"></span>
          </span>
        </div>

        <!-- Log pane -->
        <section class="log-section" x-show="currentJob || logLines.length" aria-label="Output log">
          <div class="log-header">
            <span class="log-title">
              <span class="log-pulse" x-show="submitting && !ended" aria-hidden="true"></span>
              <svg class="icon" aria-hidden="true"><use href="#i-terminal"/></svg>
              <span>Output</span>
            </span>
            <span class="log-meta">
              <span x-show="logLines.length" x-text="logLines.length + ' line' + (logLines.length === 1 ? '' : 's')"></span>
              <button type="button" class="log-meta-btn" :aria-pressed="autoScroll" @click="autoScroll = !autoScroll" title="Auto-scroll to bottom">
                <svg class="icon" aria-hidden="true"><use href="#i-bolt"/></svg>
                <span>Follow</span>
              </button>
            </span>
          </div>
          <pre class="log-pane" x-ref="logPane">
            <template x-for="(entry, idx) in logLines" :key="idx"><span :class="'log-line log-' + entry.stream" x-text="entry.line + '\n'"></span></template>
            <template x-if="!logLines.length"><span class="log-empty">Waiting for output…</span></template>
          </pre>
        </section>
      </section>
    </template>

      </div><!-- end catalog tab wrapper -->
    </template>

    <!-- ── Workflows tab ───────────────────────────────────────────── -->
    <template x-if="activeTab === 'workflows'">
      <div class="wf-panel">

        <!-- Workflow list view -->
        <template x-if="!wfEditMode && !wfSelected">
          <div>
            <div class="wf-toolbar">
              <span class="wf-toolbar-title">Workflows</span>
              <button type="button" class="btn-primary" @click="wfNewForm()">
                <svg class="icon" aria-hidden="true"><use href="#i-bolt"/></svg>
                <span>New Workflow</span>
              </button>
            </div>
            <template x-if="wfLoading"><p class="empty">Loading…</p></template>
            <template x-if="!wfLoading && workflows.length === 0">
              <div class="empty">
                <svg class="icon-xl"><use href="#i-bolt"/></svg>
                <p class="empty-title">No workflows yet</p>
                <p class="empty-detail">Create a workflow to chain scripts into pipelines.</p>
              </div>
            </template>
            <div class="wf-list">
              <template x-for="wf in workflows" :key="wf.id">
                <div class="wf-card" @click="wfSelectItem(wf)" role="button" tabindex="0" @keydown.enter.prevent="wfSelectItem(wf)">
                  <div class="wf-card-title" x-text="wf.name || wf.id"></div>
                  <div class="wf-card-meta">
                    <span class="badge" x-text="(wf.steps || []).length + ' step' + ((wf.steps || []).length === 1 ? '' : 's')"></span>
                    <span class="badge" x-show="wf.trigger && wf.trigger.type !== 'manual'" x-text="wf.trigger && wf.trigger.type"></span>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Workflow editor form -->
        <template x-if="wfEditMode && wfForm">
          <div class="wf-editor">
            <div class="wf-toolbar">
              <button type="button" class="btn-ghost" @click="wfEditMode = false; wfForm = null" :disabled="wfSaving">
                <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>
                <span>Cancel</span>
              </button>
              <span class="wf-toolbar-title" x-text="wfForm.id ? 'Edit Workflow' : 'New Workflow'"></span>
              <button type="button" class="btn-primary" @click="wfSave()" :disabled="wfSaving || !wfForm.name.trim()">
                <svg class="icon" aria-hidden="true"><use href="#i-save"/></svg>
                <span x-text="wfSaving ? 'Saving…' : 'Save'"></span>
              </button>
            </div>

            <template x-if="wfError">
              <div class="banner banner-error" role="alert">
                <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
                <span x-text="wfError"></span>
              </div>
            </template>

            <div class="wf-form-section">
              <label class="form-label"><span class="form-name">Name</span><span class="form-required">*</span></label>
              <input type="text" class="form-input" x-model="wfForm.name" placeholder="My Workflow" autocomplete="off">
            </div>

            <div class="wf-form-section">
              <label class="form-label"><span class="form-name">Trigger</span></label>
              <select class="form-input" x-model="wfForm.triggerType">
                <option value="manual">Manual</option>
                <option value="cron">Cron schedule</option>
                <option value="file-watch">File watch</option>
              </select>
              <template x-if="wfForm.triggerType === 'cron'">
                <input type="text" class="form-input" x-model="wfForm.cronExpr" placeholder="0 8 * * 1-5  (min hour dom month dow)" autocomplete="off" spellcheck="false" style="margin-top:6px;font-family:var(--font-mono)">
              </template>
            </div>

            <div class="wf-form-section">
              <div class="wf-steps-header">
                <span class="form-name">Steps</span>
                <button type="button" class="btn-ghost" @click="wfAddStep()">
                  <svg class="icon" aria-hidden="true"><use href="#i-folder-plus"/></svg>
                  <span>Add step</span>
                </button>
              </div>
              <template x-for="(step, si) in wfForm.steps" :key="si">
                <div class="wf-step-card">
                  <div class="wf-step-header">
                    <span class="wf-step-num" x-text="'Step ' + (si + 1)"></span>
                    <button type="button" class="btn-ghost wf-step-del" @click="wfRemoveStep(si)" :disabled="wfForm.steps.length <= 1" title="Remove step">
                      <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>
                    </button>
                  </div>
                  <label class="form-label"><span class="form-name">Script</span><span class="form-required">*</span></label>
                  <select class="form-input" x-model="wfForm.steps[si].scriptId">
                    <option value="" disabled>— pick a script —</option>
                    <template x-for="it in items" :key="it.id">
                      <option :value="it.path" x-text="it.name + '  (' + it.kind + ')'"></option>
                    </template>
                  </select>
                  <div class="wf-step-routing" x-show="wfForm.steps.length > 1">
                    <label class="form-label" style="flex:1"><span class="form-name">On success</span>
                      <select class="form-input" x-model="wfForm.steps[si].onSuccess">
                        <option value="next">next step</option>
                        <option value="stop">stop</option>
                        <template x-for="(other, oi) in wfForm.steps" :key="oi">
                          <template x-if="oi !== si">
                            <option :value="other.id" x-text="'→ step ' + (oi + 1)"></option>
                          </template>
                        </template>
                      </select>
                    </label>
                    <label class="form-label" style="flex:1"><span class="form-name">On failure</span>
                      <select class="form-input" x-model="wfForm.steps[si].onFailure">
                        <option value="stop">stop</option>
                        <option value="next">next step</option>
                        <template x-for="(other, oi) in wfForm.steps" :key="oi">
                          <template x-if="oi !== si">
                            <option :value="other.id" x-text="'→ step ' + (oi + 1)"></option>
                          </template>
                        </template>
                      </select>
                    </label>
                  </div>
                  <div class="wf-params-header">
                    <span class="form-name" style="font-size:.8rem;color:var(--fg-muted)">Parameters</span>
                    <button type="button" class="btn-ghost" style="font-size:.75rem;padding:2px 6px" @click="wfAddParam(si)">+ param</button>
                  </div>
                  <template x-for="(p, pi) in step.params" :key="pi">
                    <div class="wf-param-row">
                      <input type="text" class="form-input" x-model="wfForm.steps[si].params[pi].key" placeholder="Name" autocomplete="off" spellcheck="false" style="flex:1">
                      <input type="text" class="form-input" x-model="wfForm.steps[si].params[pi].val" placeholder="Value or {{step-s1.stdout}}" autocomplete="off" spellcheck="false" style="flex:2;font-family:var(--font-mono);font-size:.8rem">
                      <button type="button" class="btn-ghost" @click="wfRemoveParam(si, pi)" title="Remove param">
                        <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
                      </button>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Workflow detail / run view -->
        <template x-if="!wfEditMode && wfSelected">
          <div>
            <div class="wf-toolbar">
              <button type="button" class="btn-ghost" @click="wfBack()">
                <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>
                <span>Back</span>
              </button>
              <span class="wf-toolbar-title" x-text="wfSelected.name"></span>
              <button type="button" class="btn-ghost" @click="wfEditForm()" title="Edit">
                <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
              </button>
              <button type="button" class="btn-danger" @click="wfDelete()" title="Delete">
                <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>
              </button>
              <button type="button" class="btn-primary" @click="wfTrigger()" :disabled="wfRun && wfRun.status === 'running'">
                <svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>
                <span>Run</span>
              </button>
              <button type="button" class="btn-danger" x-show="wfRun && wfRun.status === 'running'" @click="wfKill()">
                <svg class="icon" aria-hidden="true"><use href="#i-stop"/></svg>
                <span>Kill</span>
              </button>
            </div>

            <template x-if="wfError">
              <div class="banner banner-error" role="alert">
                <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
                <span x-text="wfError"></span>
              </div>
            </template>

            <!-- Step progress -->
            <div class="wf-steps-progress">
              <template x-for="(step, si) in (wfSelected.steps || [])" :key="step.id">
                <div class="wf-step-progress" :class="'wf-step-' + wfStepStatus(step.id)">
                  <span class="wf-step-idx" x-text="si + 1"></span>
                  <span class="wf-step-name" x-text="step.id"></span>
                  <span class="wf-step-status-badge" x-text="wfStepStatus(step.id)"></span>
                </div>
              </template>
            </div>

            <!-- Run status banner -->
            <template x-if="wfRun">
              <div class="banner" :class="{'banner-error': wfRun.status === 'failed' || wfRun.status === 'killed', 'banner-ok': wfRun.status === 'done', 'banner-info': wfRun.status === 'running'}">
                <svg class="icon" aria-hidden="true"><use :href="wfRun.status === 'done' ? '#i-check' : wfRun.status === 'running' ? '#i-clock' : '#i-alert'"/></svg>
                <span>Run <code x-text="wfRun.runId && wfRun.runId.slice(-8)"></code> — <strong x-text="wfRun.status"></strong></span>
              </div>
            </template>

            <!-- Workflow steps summary -->
            <div class="wf-step-list">
              <template x-for="(step, si) in (wfSelected.steps || [])" :key="step.id">
                <div class="wf-step-detail">
                  <span class="wf-step-idx">S<span x-text="si + 1"></span></span>
                  <div class="wf-step-info">
                    <span class="wf-step-script" x-text="step.scriptId.split(/[\\/]/).pop()"></span>
                    <span class="wf-step-route" x-show="step.onSuccess || step.onFailure">
                      <span x-show="step.onSuccess" x-text="'✓ → ' + (step.onSuccess || 'next')"></span>
                      <span x-show="step.onFailure" x-text="' ✗ → ' + (step.onFailure || 'stop')"></span>
                    </span>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ── History tab ──────────────────────────────────────────────── -->
    <template x-if="activeTab === 'history'">
      <div class="hist-panel">
        <div class="wf-toolbar">
          <span class="wf-toolbar-title">Run History</span>
          <a class="btn-ghost" :href="'/api/history?format=csv&limit=500'" download="hub-history.csv">
            <svg class="icon" aria-hidden="true"><use href="#i-save"/></svg>
            <span>Export CSV</span>
          </a>
        </div>
        <template x-if="histLoading"><p class="empty">Loading…</p></template>
        <template x-if="!histLoading && histEntries.length === 0">
          <div class="empty">
            <svg class="icon-xl"><use href="#i-clock"/></svg>
            <p class="empty-title">No run history yet</p>
          </div>
        </template>
        <template x-if="histEntries.length > 0">
          <div>
            <table class="hist-table">
              <thead>
                <tr><th>Time</th><th>Script/Workflow</th><th>Status</th><th>Exit</th><th>Duration</th></tr>
              </thead>
              <tbody>
                <template x-for="(e, idx) in histEntries" :key="idx">
                  <tr>
                    <td class="hist-ts" x-text="formatMtime(e.ts)"></td>
                    <td class="hist-id" x-text="e.workflowId ? '⚡ wf' : '⬡ ' + (e.itemId || '—')"></td>
                    <td><span class="badge" :class="{ 'badge-ok': e.status === 'done', 'badge-err': e.status === 'failed' || e.status === 'killed' }" x-text="e.status"></span></td>
                    <td x-text="e.exitCode !== null && e.exitCode !== undefined ? e.exitCode : '—'"></td>
                    <td x-text="histFormatDuration(e.durationMs)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div class="hist-pagination">
              <button type="button" class="btn-ghost" @click="histPrevPage()" :disabled="histOffset === 0">← Prev</button>
              <span x-text="(histOffset + 1) + '–' + Math.min(histOffset + histLimit, histTotal) + ' of ' + histTotal"></span>
              <button type="button" class="btn-ghost" @click="histNextPage()" :disabled="histOffset + histLimit >= histTotal">Next →</button>
            </div>
          </div>
        </template>
      </div>
    </template>

  </main>

  <!-- Setup modal -->
  <template x-if="setupOpen">
    <div class="modal-backdrop" @click.self="closeSetup()" role="dialog" aria-modal="true" aria-label="Hub setup">
      <div class="modal">
        <header class="modal-header">
          <svg class="icon-lg" aria-hidden="true"><use href="#i-settings"/></svg>
          <h2 class="modal-title">Configure scan folders</h2>
        </header>

        <p class="modal-intro">
          Hub watches these folders and lists every <code>.ps1</code> and <code>.exe</code> it finds (one level deep).
          You can add up to <span x-text="config.maxScanRoots || 16"></span> folders.
        </p>

        <template x-if="setupError">
          <div class="banner banner-error" role="alert" style="margin: 0 0 var(--r-3);">
            <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
            <span x-text="setupError"></span>
          </div>
        </template>

        <div class="setup-rows">
          <template x-for="(_, idx) in setupScanRoots" :key="idx">
            <div class="setup-row">
              <input
                type="text"
                class="form-input"
                x-model="setupScanRoots[idx]"
                placeholder="C:\path\to\scripts"
                spellcheck="false"
                autocomplete="off">
              <button type="button" class="btn-ghost setup-row-btn" @click="setupBrowseFolder(idx)" :disabled="setupSaving" title="Browse for folder" aria-label="Browse for folder">
                <svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>
              </button>
              <button type="button" class="btn-ghost setup-row-btn" @click="setupRemoveRow(idx)" :disabled="setupSaving || setupScanRoots.length <= 1" title="Remove folder" aria-label="Remove folder">
                <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>
              </button>
            </div>
          </template>
        </div>

        <button
          type="button"
          class="btn-ghost setup-add-btn"
          @click="setupAddRow()"
          :disabled="setupSaving || setupScanRoots.length >= (config.maxScanRoots || 16)">
          <svg class="icon" aria-hidden="true"><use href="#i-folder-plus"/></svg>
          <span>Add folder</span>
        </button>

        <p class="modal-defaults">
          Defaults: <template x-for="d in config.defaults" :key="d"><code x-text="d" style="margin-right:6px;"></code></template>
        </p>

        <footer class="modal-footer">
          <button type="button" class="btn-ghost" @click="closeSetup()" :disabled="setupSaving">Cancel</button>
          <button type="button" class="btn-primary" @click="setupSave()" :disabled="setupSaving || setupScanRoots.length === 0">
            <svg class="icon" aria-hidden="true"><use href="#i-save"/></svg>
            <span x-show="!setupSaving">Save</span>
            <span x-show="setupSaving">Saving…</span>
          </button>
        </footer>
      </div>
    </div>
  </template>

  <!-- Command-K palette (P-ui-3) -->
  <template x-if="paletteOpen">
    <div class="dialog-backdrop palette-backdrop" @click.self="closePalette()" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="dialog palette-dialog">
        <input
          type="text"
          class="input palette-input"
          x-model="paletteQuery"
          x-init="$nextTick(() => $el.focus())"
          @keydown.arrow-down.prevent="movePaletteIndex(1)"
          @keydown.arrow-up.prevent="movePaletteIndex(-1)"
          @keydown.enter.prevent="selectPaletteItem()"
          placeholder="Search scripts and tools — Esc to close"
          spellcheck="false"
          autocomplete="off">
        <ul class="palette-list">
          <template x-for="(item, idx) in paletteResults" :key="item.id">
            <li
              class="palette-item"
              :class="{ 'palette-item-active': idx === paletteIndex }"
              @click="paletteIndex = idx; selectPaletteItem()"
              @mouseenter="paletteIndex = idx">
              <span class="palette-item-name" x-text="item.name"></span>
              <span class="palette-item-meta">
                <span class="badge" x-text="item._isWorkflow ? 'workflow' : item.kind"></span>
                <span class="palette-item-path" x-show="!item._isWorkflow" x-text="item.path" :title="item.path"></span>
                <span class="palette-item-path" x-show="item._isWorkflow" x-text="(item.steps || []).length + ' steps'"></span>
              </span>
            </li>
          </template>
          <template x-if="paletteResults.length === 0">
            <li class="palette-empty">No matches.</li>
          </template>
        </ul>
      </div>
    </div>
  </template>
</body>
</html>
